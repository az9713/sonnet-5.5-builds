<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#010205" />
    <meta name="description" content="The cosmic web of galaxies drifting past in slow time-lapse, flowing into a neural network and a mycelium. Your cursor is a point mass that bends light." />
    <title>Cosmic web • Deskworlds</title>
    <link rel="icon" href="../../ui/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "../../vendor/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <main id="stage" aria-label="Interactive cosmic web">
      <canvas id="scene" tabindex="0" aria-label="Glowing filaments, sheets and knots of the cosmic web drift past the camera and re-organise into a neural network and a mycelium. Your cursor is a point mass that bends light and pulls matter. Space pauses. F enters fullscreen."></canvas>
      <div id="loading" role="status" aria-label="Loading"></div>
      <div id="error" role="alert" hidden></div>
    </main>
    <script type="module" src="../shared/start.js" data-entry="./src/main.js"></script>
