name: pages

# Publishes the browser build of the four worlds to GitHub Pages.
# One-time setup in the repo: Settings > Pages > Build and deployment > Source: GitHub Actions.
on:
  push:
    branches: [main, claude/15-builds-recreation-review-5bw4pw]
    paths: ['deskworlds-windows/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir _site
          cp -r deskworlds-windows/index.html deskworlds-windows/scenes deskworlds-windows/vendor \
                deskworlds-windows/ui deskworlds-windows/docs _site/
          rm -rf _site/scenes/*/tests _site/ui/tests
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
